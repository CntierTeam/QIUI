name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux BLE build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: CLI smoke (offline)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --quiet
          BIN=./target/debug/qiui
          if [[ -f "${BIN}.exe" ]]; then BIN="${BIN}.exe"; fi
          "${BIN}" profiles >/dev/null
          HEX="$("${BIN}" crypto encrypt-api '{"hello":"world"}')"
          "${BIN}" crypto decrypt-api "$HEX" >/dev/null
          "${BIN}" write --mock --address AA:BB:CC:DD:EE:FF \
            --hex 06010101000000000000000000000000
