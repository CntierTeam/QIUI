[package]
name = "qiui"
version = "0.2.1"
edition = "2021"
description = "Independent QIUI Cellmate BLE/API control CLI"
license = "GPL-3.0-only"
authors = ["CntierTeam"]
readme = "README.md"
repository = "https://github.com/CntierTeam/QIUI"

[dependencies]
aes = "0.8"
base64 = "0.22"
btleplug = "0.11"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
futures = "0.3"
hex = "0.4"
hex-literal = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "io-std"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
block-padding = "0.3"
cipher = "0.4"
